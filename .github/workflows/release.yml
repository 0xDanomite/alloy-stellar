# Verified builds (SEP-0055): every v* tag builds both contracts in CI,
# stamps source_repo into the wasm, attests it, and attaches it to a release.
# Mainnet deploys use these release binaries, never a local build.
name: Build and Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  fund:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@e43b241f114bcf02151c30d61088506c6ad3ae0b # v25.1.0
    with:
      release_name: ${{ github.ref_name }}
      package: alloy-fund
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
  platform:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@e43b241f114bcf02151c30d61088506c6ad3ae0b # v25.1.0
    with:
      release_name: ${{ github.ref_name }}
      package: alloy-platform
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
